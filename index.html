<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="ReservaRest - Night Lounge & Exclusive Bar. Sistema integral de gestión de reservas, mesas, comandas, KDS de cocina/bar y despachos.">
    <meta name="theme-color" content="#0a0b0e">
    <title>ReservaRest - Night Lounge &amp; Exclusive Bar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div id="app">
        <div class="initial-app-loader">
            <div class="loader-spinner"></div>
            <p class="loader-text">Cargando <strong>ReservaRest</strong> Night Lounge...</p>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <div id="modal-root"></div>

    <noscript>
        <div
            style="background:#111319; color:#f8f9fc; padding:2rem; text-align:center; font-family:sans-serif; margin-top:20vh;">
            <h2 style="color:#ff2a6d;">Se requiere JavaScript para ejecutar ReservaRest</h2>
            <p style="color:#9da6b9; margin-top:1rem;">Por favor, habilita JavaScript en tu navegador para interactuar
                con el sistema de reservas y lounge.</p>
        </div>
    </noscript>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/modules.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
